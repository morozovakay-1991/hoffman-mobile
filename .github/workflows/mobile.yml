name: Mobile CI

on:
  push:
  pull_request:

env:
  # Keep in sync with the Flutter SDK used for local development
  # (see .metadata / `flutter --version`).
  FLUTTER_VERSION: 3.47.2

jobs:
  mobile:
    name: Format, analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        # Fatal on warnings/errors; pre-existing style `info`s (line length,
        # dependency ordering, etc.) are not blocking.
        run: flutter analyze --no-fatal-infos

      - name: Run test suite
        run: flutter test

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Compilation check only — no iOS build here, that needs a macOS
      # runner and will be added separately before release.
      - name: Build debug APK
        run: flutter build apk --debug
